name: Cleanup HFSY uploads

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-hfsy-inputs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Remove uploads older than 3 days
        shell: bash
        run: |
          set -euo pipefail
          root="hfsy-inputs"
          cutoff="$(date -u -d '3 days ago' +%F)"
          changed=0
          shopt -s nullglob

          for dir in "$root"/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || continue

            if [[ "$name" < "$cutoff" || "$name" == "$cutoff" ]]; then
              git rm -r -- "$dir"
              changed=1
            fi
          done

          if [ "$changed" -eq 0 ]; then
            echo "No expired uploads."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove HFSY uploads older than 3 days"
          git push
